; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_d32]
platform = espressif32
board = lolin_d32
framework = arduino
; 80 MHz suffisent largement (affichage, WiFi, JSON) et consomment nettement
; moins que les 240 MHz par défaut.
board_build.f_cpu = 80000000L
monitor_speed = 115200
lib_deps = 
    zinggjm/GxEPD2@^1.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ricmoo/QRCode@^0.0.1


; Même firmware, avec les traces série activées. Utile pour diagnostiquer
; sans avoir à modifier le code : pio run -e lolin_d32_debug -t upload
[env:lolin_d32_debug]
extends = env:lolin_d32
build_flags = -DENABLE_STATION_LOGS=1
